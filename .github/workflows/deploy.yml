name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to the web directory
            cd /var/www/html || cd /home/${{ secrets.EC2_USERNAME }}/website
            
            # Pull latest changes
            sudo git pull origin main || git pull origin main
            
            # Set proper permissions
            sudo chown -R www-data:www-data . || sudo chown -R ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} .
            sudo chmod -R 755 .
            
            # Restart web server if needed
            sudo systemctl restart apache2 || sudo systemctl restart nginx || true
            
            echo "Deployment completed successfully!"
